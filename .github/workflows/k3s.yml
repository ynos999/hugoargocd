name: Deploy to K3s via SSH

on:
  push:
    branches:
      - main  # Vai cita jūsu noklusējuma atzara nosaukums

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_PRIVATE_KEY }}

      - name: Create SSH tunnel and deploy
        run: |
          # Pārbaudīt, vai SSH savienojums darbojas
          ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.K3STEST_SERVER_IP }} "echo SSH OK"
          
          # Kopēt YAML failus no hugo mapes uz serveri
          scp -o StrictHostKeyChecking=no hugo/deployment.yaml hugo/ingress.yaml hugo/service.yaml hugo/autoscale.yaml ${{ secrets.TEST_SERVER_USER }}@${{ secrets.K3STEST_SERVER_IP }}:/tmp/
          
          # Palaist komandas uz attālā servera
          ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.K3STEST_SERVER_IP }} <<EOF
            # Konfigurācijas dublēšana pirms jaunas pielietošanas
            kubectl get -f /tmp/deployment.yaml -o yaml > /tmp/deployment-previous.yaml || true
            kubectl get -f /tmp/ingress.yaml -o yaml > /tmp/ingress-previous.yaml || true
            kubectl get -f /tmp/service.yaml -o yaml > /tmp/service-previous.yaml || true
            kubectl get -f /tmp/autoscale.yaml -o yaml > /tmp/autoscale-previous.yaml || true

            # Pielietot jauno konfigurāciju
            kubectl apply -f /tmp/deployment.yaml
            kubectl apply -f /tmp/ingress.yaml
            kubectl apply -f /tmp/service.yaml
            kubectl apply -f /tmp/autoscale.yaml
          EOF
          
      - name: Archive previous configuration for rollback
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: previous-config
          path: |
            /tmp/deployment-previous.yaml
            /tmp/ingress-previous.yaml
            /tmp/service-previous.yaml
            /tmp/autoscale-previous.yaml

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_PRIVATE_KEY }}

      - name: Download previous configuration
        uses: actions/download-artifact@v4
        with:
          name: previous-config
          path: .
          
      - name: Rollback deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.K3STEST_SERVER_IP }} <<EOF
            # Pielietot atgriezenisko konfigurāciju, ja tā pastāv
            if [ -f /tmp/deployment-previous.yaml ]; then
              kubectl apply -f /tmp/deployment-previous.yaml
            fi
            if [ -f /tmp/ingress-previous.yaml ]; then
              kubectl apply -f /tmp/ingress-previous.yaml
            fi
            if [ -f /tmp/service-previous.yaml ]; then
              kubectl apply -f /tmp/service-previous.yaml
            fi
            if [ -f /tmp/autoscale-previous.yaml ]; then
              kubectl apply -f /tmp/autoscale-previous.yaml
            fi
          EOF


#Tests